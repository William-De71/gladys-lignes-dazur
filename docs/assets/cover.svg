<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Lignes d'Azur integration for Gladys Assistant
       (illustration, not the logo of Lignes d'Azur nor of the Métropole Nice
       Côte d'Azur). Nice in the morning: the Baie des Anges and the castle
       hill, the palm trees and the blue chairs of the Promenade, a tram of
       line L1 in its line colour, and a screen of the stop announcing the
       next departures with a delay. The line colours are the ones of the
       GTFS of Lignes d'Azur. Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fd2"/>
      <stop offset="0.6" stop-color="#9fd0f0"/>
      <stop offset="1" stop-color="#e8f4fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7fb8"/>
      <stop offset="1" stop-color="#36b0c9"/>
    </linearGradient>
    <linearGradient id="tram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#c3cad3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4e66"/>
      <stop offset="1" stop-color="#1d2a3a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <g id="palm">
      <path d="M0 0 C-3 -40 -2 -90 4 -130" stroke="#8a6a46" stroke-width="7" fill="none"/>
      <g fill="#2f8a4a">
        <path d="M4 -130 C-20 -142 -46 -136 -64 -118 C-40 -126 -20 -126 4 -124 Z"/>
        <path d="M4 -130 C28 -146 54 -140 70 -122 C46 -130 26 -128 4 -124 Z"/>
        <path d="M4 -130 C-6 -156 -30 -166 -50 -160 C-28 -150 -12 -142 2 -126 Z"/>
        <path d="M4 -130 C16 -158 40 -166 58 -158 C36 -150 20 -142 6 -126 Z"/>
        <path d="M4 -130 C2 -150 6 -168 12 -176 C12 -160 10 -146 6 -128 Z"/>
      </g>
    </g>
    <g id="chair">
      <rect x="0" y="0" width="22" height="4" rx="1" fill="#1d5fa8"/>
      <rect x="2" y="-18" width="4" height="20" fill="#1d5fa8" transform="rotate(-12 4 0)"/>
      <rect x="2" y="4" width="3" height="10" fill="#174b85"/>
      <rect x="17" y="4" width="3" height="10" fill="#174b85"/>
    </g>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <circle cx="120" cy="92" r="40" fill="#fff6d8" opacity="0.9"/>

  <!-- the castle hill and the old town, the hills behind -->
  <path d="M0 236 L90 204 L200 214 L330 190 L460 206 L560 186 L680 198 L800 182 L800 250 L0 250 Z" fill="#8fb3a2"/>
  <path d="M560 250 L560 214 C590 186 640 176 690 190 C730 200 760 222 780 250 Z" fill="#6f9a72"/>
  <g fill="#f2c68f">
    <rect x="470" y="222" width="34" height="28"/>
    <rect x="508" y="214" width="26" height="36"/>
    <rect x="538" y="226" width="30" height="24"/>
  </g>
  <g fill="#e48a5a">
    <rect x="470" y="218" width="34" height="5"/>
    <rect x="508" y="210" width="26" height="5"/>
    <rect x="538" y="222" width="30" height="5"/>
  </g>

  <!-- the Baie des Anges -->
  <path d="M0 250 L800 250 L800 300 L0 300 Z" fill="url(#sea)"/>
  <g stroke="#e8f7fb" stroke-width="2" opacity="0.7">
    <line x1="40" y1="266" x2="90" y2="266"/>
    <line x1="180" y1="280" x2="240" y2="280"/>
    <line x1="330" y1="262" x2="370" y2="262"/>
    <line x1="430" y1="288" x2="500" y2="288"/>
    <line x1="620" y1="272" x2="680" y2="272"/>
  </g>
  <path d="M0 298 C120 292 260 302 400 296 C540 290 680 300 800 294 L800 312 L0 312 Z" fill="#e9dcc2"/>

  <!-- the Promenade: palm trees and blue chairs -->
  <rect x="0" y="312" width="800" height="26" fill="#d9d2c6"/>
  <use href="#palm" x="60" y="338"/>
  <use href="#palm" x="250" y="338"/>
  <use href="#palm" x="720" y="338"/>
  <use href="#chair" x="110" y="322"/>
  <use href="#chair" x="150" y="322"/>
  <use href="#chair" x="292" y="322"/>
  <rect x="0" y="338" width="800" height="196" fill="#a9a196"/>
  <rect x="0" y="420" width="800" height="6" fill="#857d71"/>
  <rect x="0" y="432" width="800" height="4" fill="#857d71"/>

  <!-- the tram of line L1, its red band (the line colour) -->
  <g transform="translate(300 346)">
    <rect x="0" y="0" width="470" height="76" rx="16" fill="url(#tram)"/>
    <rect x="0" y="54" width="470" height="10" fill="#d20a11"/>
    <g fill="url(#glass)">
      <rect x="14" y="14" width="40" height="30" rx="6"/>
      <rect x="66" y="14" width="66" height="30" rx="4"/>
      <rect x="144" y="14" width="66" height="30" rx="4"/>
      <rect x="222" y="14" width="66" height="30" rx="4"/>
      <rect x="300" y="14" width="66" height="30" rx="4"/>
      <rect x="378" y="14" width="78" height="30" rx="4"/>
    </g>
    <rect x="20" y="2" width="44" height="10" rx="3" fill="#0b0f16"/>
    <text x="42" y="10.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffd166" text-anchor="middle">L1</text>
    <line x1="230" y1="0" x2="250" y2="-30" stroke="#2f3a48" stroke-width="3"/>
    <line x1="250" y1="-30" x2="282" y2="-30" stroke="#2f3a48" stroke-width="3"/>
    <g fill="#2f3a48">
      <circle cx="60" cy="78" r="9"/>
      <circle cx="100" cy="78" r="9"/>
      <circle cx="370" cy="78" r="9"/>
      <circle cx="410" cy="78" r="9"/>
    </g>
  </g>
  <line x1="0" y1="316" x2="800" y2="316" stroke="#2f3a48" stroke-width="2" opacity="0.6"/>

  <!-- the screen of the stop -->
  <g transform="translate(36 362)">
    <rect x="98" y="118" width="10" height="54" fill="#3b4656"/>
    <rect x="0" y="0" width="206" height="124" rx="10" fill="#3b4656"/>
    <rect x="8" y="8" width="190" height="108" rx="6" fill="url(#screen)"/>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">
      <rect x="18" y="20" width="26" height="18" rx="3" fill="#d20a11"/>
      <text x="31" y="34" fill="#ffffff" text-anchor="middle" font-size="11">L1</text>
      <text x="52" y="34" fill="#ffd166" font-size="12">Pasteur</text>
      <text x="186" y="34" fill="#ffd166" text-anchor="end">2 min</text>
      <rect x="18" y="50" width="26" height="18" rx="3" fill="#1f488f"/>
      <text x="31" y="64" fill="#ffffff" text-anchor="middle" font-size="11">L2</text>
      <text x="52" y="64" fill="#ffd166" font-size="12">Aéroport</text>
      <text x="186" y="64" fill="#ffd166" text-anchor="end">6 min</text>
      <rect x="18" y="80" width="26" height="18" rx="3" fill="#00853e"/>
      <text x="31" y="94" fill="#ffffff" text-anchor="middle" font-size="11">L3</text>
      <text x="52" y="94" fill="#ffd166" font-size="12">St-Isidore</text>
      <text x="186" y="94" fill="#ff8a5c" text-anchor="end">+3</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">
    <rect x="290" y="34" width="472" height="96" rx="14" fill="#ffffff" opacity="0.92"/>
    <text x="526" y="80" font-size="34" fill="#1b3a5c" text-anchor="middle">Lignes d’Azur · Nice</text>
    <text x="526" y="112" font-size="18" font-weight="400" fill="#33536f" text-anchor="middle">Trams et bus en temps réel dans Gladys</text>
  </g>
</svg>
